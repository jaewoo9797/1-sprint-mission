spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
      
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:schema.sql


discodeit:
  repository:
    type: file   # jcf | file
    file-directory: .discodeit

# Swagger
springdoc:
  swagger-ui:
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: method

# SQL Logging
logging:
  level:
    org:
      hibernate:
        SQL: debug
        type:
          descriptor:
            sql: trace
